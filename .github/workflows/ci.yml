# Validation, on every push and pull request. Nothing here deploys.
#
# The same checks run again before every deploy, from the owner's machine:
# scripts/ship.sh, docs/CI.md. Where it deploys to is not in this repository.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, test, build the app
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # package.json's volta pin: the Node the lockfile was written with.
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run check:architecture
      - run: npm run typecheck
      - run: npm test
      - name: Build the app for the web
        run: npm run build:web
        env:
          EXPO_PUBLIC_API_URL: same-origin

  e2e:
    name: The app end to end, in a browser
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Builds the app as it ships, then runs e2e/ against a read-only server of its own, every device simulated.
      - run: npm run test:e2e
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report
          path: |
            e2e-report/
            e2e-results/
          retention-days: 7

  stack:
    name: Build the images, run the stack, attack it
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/ci/smoke-docker.sh
      - name: Keep the stack's logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-logs
          path: smoke-logs.txt
          retention-days: 7
