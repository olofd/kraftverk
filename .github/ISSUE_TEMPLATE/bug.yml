name: Bug
description: Something in kraftverk itself is broken.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste keys, passwords, your IP address or anything that identifies your home.** A security problem does not belong here — see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      placeholder: |
        1. Add a device of type …
        2. Open its settings …
  - type: dropdown
    id: where
    attributes:
      label: Where it runs
      multiple: true
      options:
        - Docker
        - npm run dev / start:prod on the host
        - The web app in a browser
        - The app on a phone
  - type: input
    id: version
    attributes:
      label: kraftverk version or commit
  - type: textarea
    id: log
    attributes:
      label: Log
      description: App settings → Server log, or the container's log. Check it for anything private first.
      render: text
