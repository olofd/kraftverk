# kraftverk's pipeline on Forgejo: every push to main checked, built,
# attacked, and — while the repository's variable KRAFTVERK_DEPLOY is "on" —
# deployed onto the server the runner runs on, the station kept connected.
# The broker is recreated only when asked: broker.yml. docs/DEPLOY.md.
#
# The runner gives each job a network of its own (docs/DEPLOY.md, "The
# runner"), never the server's: there a test server looking for a broker on
# 127.0.0.1:1883 would find the real one. The jobs that build, start and
# ship images use the server's Docker, mounted by name — so the images the
# stack job attacks are the very ones the deploy job ships.

name: Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SERVER_IMAGE: kraftverk-server:${{ github.sha }}
  WEB_IMAGE: kraftverk-web:${{ github.sha }}

jobs:
  # The checks split in parallel jobs, the deploy waiting for all of them:
  # the end-to-end suite, the longest, in two shards side by side in one job —
  # one install and one build of the app for both, each shard with servers and
  # a database of its own. Every check job runs in one image, built once.
  checks-image:
    name: The image the checks run in
    runs-on: docker
    container:
      image: docker:29-cli
      volumes: [/var/run/docker.sock:/var/run/docker.sock]
    timeout-minutes: 15
    steps:
      - name: Tools
        shell: sh
        run: apk add --no-cache git nodejs
      - uses: actions/checkout@v4
      # Built only when scripts/ci/checks.Dockerfile changed; otherwise Docker's
      # cache answers at once.
      - run: docker build -t kraftverk-checks:pipeline -f scripts/ci/checks.Dockerfile scripts/ci

  static:
    name: Architecture, types and unused code
    needs: checks-image
    runs-on: docker
    container:
      image: kraftverk-checks:pipeline
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run check:architecture
      - run: npm run typecheck
      - run: npm run knip

  unit:
    name: The tests
    needs: checks-image
    runs-on: docker
    container:
      image: kraftverk-checks:pipeline
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm test

  e2e:
    name: The app end to end
    needs: checks-image
    runs-on: docker
    container:
      image: kraftverk-checks:pipeline
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      # Builds the app as it ships, once, then runs e2e/ as two shards side by
      # side, each against read-only servers of its own, every device simulated.
      - run: npm run test:e2e -- --shards=2
        env:
          CI: "1"
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: e2e-report
          path: |
            e2e-report/
            e2e-results/
          retention-days: 7

  stack:
    name: Build the images, run the stack, attack it
    runs-on: docker
    container:
      image: docker:29-cli
      volumes: [/var/run/docker.sock:/var/run/docker.sock]
    timeout-minutes: 40
    steps:
      - name: Tools
        shell: sh
        run: apk add --no-cache bash coreutils curl git nodejs
      - uses: actions/checkout@v4
      - run: docker build --target server -t "$SERVER_IMAGE" . && docker build --target web -t "$WEB_IMAGE" .
      # The stack is started on the server's Docker, its ports published there:
      # the job reaches them at the server's address on its network, the
      # internet entrance too. By address, not by the name host.docker.internal,
      # which kraftverk rightly refuses: it answers to names it knows.
      - run: SMOKE_HOST=$(getent hosts host.docker.internal | awk '{ print $1; exit }') bash scripts/ci/smoke-docker.sh
        env:
          SMOKE_BUILD: "0"
          # A stack and ports of this run's own: two pushes at once never meet.
          SMOKE_RUN: ${{ github.run_number }}
          KRAFTVERK_PUBLIC_BIND: 0.0.0.0
          KRAFTVERK_HOME_PROXY_BIND: 0.0.0.0
          KRAFTVERK_SERVER_IMAGE: ${{ env.SERVER_IMAGE }}
          KRAFTVERK_WEB_IMAGE: ${{ env.WEB_IMAGE }}
      - name: Keep the stack's logs
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: smoke-logs
          path: smoke-logs.txt
          retention-days: 7

  deploy:
    name: Deploy the server and the app
    # All must pass: `stack` built and attacked the very images shipped here.
    needs: [static, unit, e2e, stack]
    if: vars.KRAFTVERK_DEPLOY == 'on'
    runs-on: docker
    container:
      image: docker:29-cli
      volumes: [/var/run/docker.sock:/var/run/docker.sock]
    timeout-minutes: 20
    steps:
      - name: Tools
        shell: sh
        run: apk add --no-cache bash git nodejs
      - uses: actions/checkout@v4
      - name: Deploy
        run: |
          umask 077
          printf '%s\n' "$DEPLOY_ENV" > "$RUNNER_TEMP/deploy.env"
          KRAFTVERK_DEPLOY_ENV="$RUNNER_TEMP/deploy.env" \
            KRAFTVERK_SERVER_IMAGE="$SERVER_IMAGE" KRAFTVERK_WEB_IMAGE="$WEB_IMAGE" \
            bash scripts/deploy.sh
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
