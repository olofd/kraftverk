<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="kraftverk">
  <!--
    kraftverk: a charge ring with a bolt inside — the station's own gauge, the
    signature element of the app, as a mark. Dark tile so it reads on light and
    dark pages alike; the ring runs from empty (bottom left) to full (bottom
    right) and is nearly there.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2230"/>
      <stop offset="1" stop-color="#0B0F17"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#5EEAD4"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9FBE7"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="128" height="128" rx="30" fill="url(#tile)"/>
  <rect x="0.5" y="0.5" width="127" height="127" rx="29.5" fill="none" stroke="#FFFFFF" stroke-opacity=".07"/>

  <!-- The track: the whole gauge, faint. Arc from 135° to 405° (bottom-left round to bottom-right). -->
  <path d="M 34.3 93.7 A 42 42 0 1 1 93.7 93.7" fill="none" stroke="#FFFFFF" stroke-opacity=".10" stroke-width="10" stroke-linecap="round"/>

  <!-- The charge: most of the way round. -->
  <path d="M 34.3 93.7 A 42 42 0 1 1 93.7 93.7" fill="none" stroke="url(#ring)" stroke-opacity=".35" stroke-width="10" stroke-linecap="round" filter="url(#glow)" pathLength="100" stroke-dasharray="84 16"/>
  <path d="M 34.3 93.7 A 42 42 0 1 1 93.7 93.7" fill="none" stroke="url(#ring)" stroke-width="10" stroke-linecap="round" pathLength="100" stroke-dasharray="84 16"/>

  <!-- The bolt. -->
  <path d="M 69.5 36 L 49 70 H 62 L 57.5 94 L 79 60 H 66 Z" fill="url(#bolt)"/>
</svg>
