# Validation on GitLab — the same checks as .github/workflows/ci.yml.
#
# Only jobs, no stages: this file is included by the pipeline that uses it,
# which declares `validate` and `image` among its stages, and adds whatever
# comes after. Nothing here deploys.
#
# The images are pushed to this project's own container registry, tagged with
# the commit, with the build cache beside them. Whatever deploys them must
# depend on `stack`, whose smoke test is what says they are fit to run — what
# is deployed is then exactly what was tested.

variables:
  SERVER_IMAGE: $CI_REGISTRY_IMAGE/server:$CI_COMMIT_SHA
  WEB_IMAGE: $CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHA

validate:
  stage: validate
  # package.json's volta pin.
  image: node:24.21.0-bookworm
  timeout: 25m
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  variables:
    npm_config_cache: $CI_PROJECT_DIR/.npm
  script:
    - npm ci
    - npm run check:architecture
    - npm run typecheck
    - npm test
    - EXPO_PUBLIC_API_URL=same-origin npm run build:web

stack:
  stage: image
  # Beside validate, not after it: they are independent, and whatever comes
  # next needs both.
  needs: []
  image: docker:29
  services:
    - docker:29-dind
  timeout: 30m
  variables:
    DOCKER_TLS_CERTDIR: /certs
    # The stack runs in the dind service, so its ports are published there.
    SMOKE_HOST: docker
    KRAFTVERK_PUBLIC_BIND: 0.0.0.0
  before_script:
    - apk add --no-cache bash curl coreutils
    - echo "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # buildx will not take the dind service's TLS settings from the environment;
    # a context carries them.
    - docker context create kraftverk-ci > /dev/null
    - docker buildx create --use --driver docker-container --name kraftverk kraftverk-ci > /dev/null
  script:
    # BuildKit, with its cache kept in the registry: an unchanged lockfile
    # means the dependency layers are not rebuilt — and are pushed as the very
    # same blobs, so a host that has them does not download them again.
    # Pushed straight from BuildKit for that reason, and loaded for the smoke
    # test; nothing deploys an image until that test has passed.
    #
    # In two steps, and the cache beside its image. Exporting the cache and
    # pushing the image in one build uploaded the same layers twice at once,
    # into two repositories, and the image's manifest was refused for a layer
    # the registry had not finished taking ("blob unknown to registry"). Now
    # the first build loads the image and writes the cache; the second is all
    # cache hits and only pushes — retried, since pushing is safe to repeat.
    - |
      set -e
      for target in server web; do
        if [ "$target" = server ]; then tag="$SERVER_IMAGE"; else tag="$WEB_IMAGE"; fi
        cache="type=registry,ref=$CI_REGISTRY_IMAGE/$target:buildcache"
        docker buildx build --target "$target" --tag "$tag" --load \
          --cache-from "$cache" \
          --cache-to "$cache,mode=max,image-manifest=true,oci-mediatypes=true" \
          .
        for attempt in 1 2 3; do
          if docker buildx build --target "$target" --tag "$tag" --push --cache-from "$cache" --quiet . > /dev/null; then
            break
          fi
          [ "$attempt" = 3 ] && { echo "Could not push $tag" >&2; exit 1; }
          echo "Pushing $tag failed; trying again ($attempt)" >&2
          sleep 5
        done
      done
    - SMOKE_BUILD=0 KRAFTVERK_SERVER_IMAGE="$SERVER_IMAGE" KRAFTVERK_WEB_IMAGE="$WEB_IMAGE" bash scripts/ci/smoke-docker.sh
  artifacts:
    when: on_failure
    expire_in: 7 days
    paths: [smoke-logs.txt]
