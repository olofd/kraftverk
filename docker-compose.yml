# kraftverk: the app, the server, and the MQTT broker stations connect to.
#
# The default is the safe one: writes to hardware refused. Read docs/DOCKER.md
# before changing it — it is the difference between a dashboard and something
# that can switch mains power.
#
# Everything a particular installation sets — whether writes are allowed, the
# secret key, the public name it is reached by — goes in a `.env` file beside this one,
# not in this file. See docs/DOCKER.md#environment.
#
# Three services:
#
#   web        serves the app and forwards /api to the server. The only thing
#              anyone opens in a browser: http://<this machine>:8080
#   kraftverk  the server. Not published beyond this machine's loopback.
#   broker     where stations connect. Its own container, so restarting or
#              upgrading the server does not drop the station: a P280 that
#              loses its broker for long enough stops trying to reconnect, and
#              then only a power-cycle brings it back. See docs/BROKER.md.

x-logging: &logging
  # `docker logs`, kept small: a NAS disk is not for filling with console
  # output. The server and the broker also keep their own dated files on the
  # data volume, which outlive the container — these do not, and a deploy
  # recreates it. See docs/DOCKER.md#diagnosing-a-problem.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  broker:
    logging: *logging
    build: { context: ., target: server }
    image: ${KRAFTVERK_SERVER_IMAGE:-kraftverk-server}
    restart: ${KRAFTVERK_RESTART:-unless-stopped}
    command: ["bun", "run", "packages/transports/mqtt/src/broker/main.ts"]

    ports:
      # The port stations connect to. It must be reachable on the host's LAN
      # address — the station is a separate device on the network. Never
      # forward it from the router.
      - "${KRAFTVERK_MQTT_PORT:-1883}:1883"
      # The admin API (3883) is deliberately not published: it is for the
      # server container, which reaches it over the compose network.

    environment:
      # Listen on the container's network, so the server's container can reach
      # the admin API. Still not reachable from outside: the port is not published.
      BROKER_ADMIN_HOST: "0.0.0.0"
      # Clients that sign in (docs/BROKER.md): Zigbee2MQTT, with the password the
      # deploy gives both — none set, none signs in, and its devices' topics are
      # refused to everyone.
      KRAFTVERK_BROKER_CLIENTS: zigbee2mqtt=${KRAFTVERK_ZIGBEE2MQTT_PASSWORD:-}

    volumes:
      # Shared with the server: the token it proves itself with, the broker's
      # journal, and the stations it has seen.
      - kraftverk-data:/data

    healthcheck:
      test: ["CMD", "bun", "--eval", "process.exit((await fetch('http://127.0.0.1:3883/health').catch(() => null))?.ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3

  kraftverk:
    logging: *logging
    build: { context: ., target: server }
    image: ${KRAFTVERK_SERVER_IMAGE:-kraftverk-server}
    restart: ${KRAFTVERK_RESTART:-unless-stopped}
    depends_on:
      - broker

    ports:
      # For the recovery CLI and diagnostics on this machine only. Browsers go
      # through `web`; publishing this on the LAN would be a second way in that
      # skips it.
      - "127.0.0.1:${KRAFTVERK_API_PORT:-3333}:3333"
      # For the relay, on this machine only: the one connection between the
      # home network and this container.
      - "127.0.0.1:${KRAFTVERK_RELAY_PORT:-3334}:3334"

    environment:
      # 1 refuses every write to hardware; simulated devices take writes
      # either way. The npm dev scripts pass --read-only; nothing passes it
      # for you here, so it is set
      # explicitly rather than left to a default that means "writes allowed".
      # Only an explicit READ_ONLY=0 turns writes on.
      READ_ONLY: ${READ_ONLY:-1}

      # The broker is the service above. The server connects to it, and never
      # starts one of its own.
      BROKER_SPAWN: "0"
      BROKER_HOST: broker
      BROKER_ADMIN_URL: http://broker:3883

      # The web container, by its service name: the one proxy whose "this came
      # in through the home-network entrance" is believed.
      KRAFTVERK_TRUSTED_PROXIES: web

      # The public name this server is reached by — a DDNS name — if any.
      # Requests under any other name are refused (DNS rebinding).
      KRAFTVERK_ALLOWED_HOSTS: ${KRAFTVERK_ALLOWED_HOSTS:-}

      # Without this, plugin secrets — a Tuya plug's local key — are stored as
      # given, and the app says so plainly. A long random string, in `.env`.
      KRAFTVERK_SECRET_KEY: ${KRAFTVERK_SECRET_KEY:-}

      # Where the relay (below) connects, inside this container: the home
      # network is heard through it. The token it proves itself with is made
      # here, the first time, in the volume the two share and nothing else.
      KRAFTVERK_LAN_RELAY_PORT: "3334"
      KRAFTVERK_LAN_RELAY_TOKEN_FILE: /relay/token

      # Bluetooth, through the host's BlueZ over its system bus (mounted below):
      # the stack that owns the radio already, asked rather than fought with —
      # no host networking, no capabilities (docs/DOCKER.md#bluetooth).
      DBUS_SYSTEM_BUS_ADDRESS: unix:path=/run/dbus/system_bus_socket

    volumes:
      # Devices, history, accounts, plugin config, secrets and the audit
      # timeline. Delete this volume and you are back to a blank canvas.
      - kraftverk-data:/data
      - kraftverk-relay:/relay
      # The host's system bus, for BlueZ. The folder, not the socket: D-Bus
      # restarted makes a new one. Read-only, which still lets it connect.
      # Where the host has none — Docker Desktop — it is empty, and
      # Bluetooth says it is not here.
      - /run/dbus:/run/dbus:ro

  # The one service on the home network itself (docs/DOCKER.md#the-relay):
  # devices that announce themselves — a broadcast, mDNS, SSDP — are heard
  # only there, never in a container. It hears for the server and passes on
  # what it hears over one connection, to the port above. It opens nothing
  # to a device, holds nothing but its token, and runs no integration's code.
  relay:
    logging: *logging
    build: { context: ., target: server }
    image: ${KRAFTVERK_SERVER_IMAGE:-kraftverk-server}
    restart: ${KRAFTVERK_RESTART:-unless-stopped}
    network_mode: host
    command: ["bun", "run", "packages/transports/lan/src/relay-main.ts"]
    environment:
      KRAFTVERK_RELAY_SERVER: 127.0.0.1:${KRAFTVERK_RELAY_PORT:-3334}
      KRAFTVERK_LAN_RELAY_TOKEN_FILE: /relay/token
    volumes:
      # Its token, which the server makes: nothing else of the home's.
      - kraftverk-relay:/relay:ro
    # Healthy while the server has taken it: the image's own check is the server's.
    healthcheck:
      test: ["CMD", "bun", "--eval", "process.exit(require('node:fs').existsSync('/tmp/relay-connected') ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3

  # Zigbee, where a coordinator is plugged into the host (docs/DOCKER.md#zigbee):
  # Zigbee2MQTT, at the edge as the relay is, given the dongle and nothing
  # else of the host's, publishing to the broker above. The zigbee2mqtt
  # integration makes a device of each thing on it. Only with the profile:
  # COMPOSE_PROFILES=zigbee, and the dongle's path in KRAFTVERK_ZIGBEE_ADAPTER.
  zigbee2mqtt:
    profiles: [zigbee]
    logging: *logging
    # Pinned: its MQTT API and its exposes are what the integration reads; a new
    # release is taken in a commit of its own, its notes read (docs/PLAN-ZIGBEE.md §5.5).
    image: ghcr.io/koenkk/zigbee2mqtt:2.14.2
    restart: ${KRAFTVERK_RESTART:-unless-stopped}
    depends_on:
      - broker
    devices:
      # The dongle, by its stable /dev/serial/by-id path on the host.
      - ${KRAFTVERK_ZIGBEE_ADAPTER:-/dev/null}:/dev/zigbee
    environment:
      TZ: ${TZ:-Europe/Stockholm}
      # Configured by these alone: no onboarding page, and on first start it
      # writes its own configuration — a new network key — into its volume.
      Z2M_ONBOARD_NO_SERVER: "1"
      ZIGBEE2MQTT_CONFIG_SERIAL_PORT: /dev/zigbee
      # zstack for a TI coordinator (Sonoff ZBDongle-P), ember for Silicon Labs (ZBDongle-E).
      ZIGBEE2MQTT_CONFIG_SERIAL_ADAPTER: ${KRAFTVERK_ZIGBEE_ADAPTER_TYPE:-zstack}
      ZIGBEE2MQTT_CONFIG_MQTT_SERVER: mqtt://broker:1883
      # The integration's base topic: fixed, it is the coordinator's address on the broker.
      ZIGBEE2MQTT_CONFIG_MQTT_BASE_TOPIC: zigbee2mqtt
      ZIGBEE2MQTT_CONFIG_MQTT_CLIENT_ID: zigbee2mqtt
      # Signed in: only it may speak for a Zigbee device on the broker.
      ZIGBEE2MQTT_CONFIG_MQTT_USER: zigbee2mqtt
      ZIGBEE2MQTT_CONFIG_MQTT_PASSWORD: ${KRAFTVERK_ZIGBEE2MQTT_PASSWORD:-}
      # Whether each device answers, said on its availability topic; off, kraftverk cannot tell.
      ZIGBEE2MQTT_CONFIG_AVAILABILITY_ENABLED: "true"
      # What a device last said, kept on the broker: a server restarting reads it at once.
      ZIGBEE2MQTT_CONFIG_DEVICE_OPTIONS_RETAIN: "true"
      # When each device last spoke, in what it says: a state replayed from the broker keeps its own time.
      ZIGBEE2MQTT_CONFIG_ADVANCED_LAST_SEEN: ISO_8601
      # kraftverk is its interface: no web page of its own, no Home Assistant discovery.
      ZIGBEE2MQTT_CONFIG_FRONTEND_ENABLED: "false"
      ZIGBEE2MQTT_CONFIG_HOMEASSISTANT_ENABLED: "false"
    volumes:
      # Its network — the key every paired device knows — and what is paired.
      # Lose it and every device pairs again.
      - zigbee2mqtt-data:/app/data

  web:
    logging: *logging
    build: { context: ., target: web }
    image: ${KRAFTVERK_WEB_IMAGE:-kraftverk-web}
    restart: ${KRAFTVERK_RESTART:-unless-stopped}
    depends_on:
      kraftverk:
        condition: service_started

    ports:
      # The home network's entrance: open this in a browser.
      - "${KRAFTVERK_LAN_PORT:-8080}:8080"
      # The home network's entrance for a reverse proxy on this machine that
      # gives kraftverk a name of its own (kraftverk.local). Loopback only, like
      # the internet's below: only that proxy reaches it. Never publish it wider
      # (KRAFTVERK_HOME_PROXY_BIND exists for CI, whose Docker runs elsewhere).
      - "${KRAFTVERK_HOME_PROXY_BIND:-127.0.0.1}:${KRAFTVERK_HOME_PROXY_PORT:-8081}:8081"
      # The internet's entrance, for a reverse proxy on this machine that
      # terminates HTTPS — DSM's, on a Synology. Loopback only: the internet
      # reaches it through that proxy and nowhere else. Never publish it wider
      # (KRAFTVERK_PUBLIC_BIND exists for CI, whose Docker runs elsewhere).
      - "${KRAFTVERK_PUBLIC_BIND:-127.0.0.1}:${KRAFTVERK_PUBLIC_PORT:-8090}:8090"

volumes:
  kraftverk-data:
  # Zigbee2MQTT's network and what is paired with it (the zigbee profile).
  zigbee2mqtt-data:
  # The relay's token, shared by the server, which makes it, and the relay, which reads it.
  kraftverk-relay:
